<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atlas de Herdeiros do Caos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* ================= ESTILO GERAL ================= */
        :root {
            --bg-dark: #0a0a0a;
            --bg-panel: rgba(20, 20, 20, 0.95);
            --border: #333;
            --accent: #9c27b0;
            --accent-dark: #6a1b9a;
            --danger: #d32f2f;
            --text-main: #e0e0e0;
            --shadow-sub: 0 0 20px rgba(156, 39, 176, 0.5);
        }

        body { margin: 0; padding: 0; background: var(--bg-dark); font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; color: var(--text-main); }
        
        /* Container principal para segurar os dois mapas */
        #maps-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Estilo comum para os mapas */
        .map-instance {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            cursor: default;
            transition: opacity 0.5s ease, z-index 0.5s step-end;
        }

        /* Mapa Principal na frente */
        #map { z-index: 2; opacity: 1; }

        /* Mapa Secundário atrás, invisível inicialmente */
        #sub-map-container {
            z-index: 1;
            opacity: 0;
            pointer-events: none; /* Impede interações quando escondido */
        }
        
        #sub-map { width: 100%; height: 100%; }

        /* Estado quando o SubMapa está ativo */
        body.submap-active #map {
            opacity: 0;
            z-index: 1;
            pointer-events: none;
        }
        body.submap-active #sub-map-container {
            opacity: 1;
            z-index: 2;
            pointer-events: auto;
        }

        /* Botão flutuante para voltar do submapa */
        #btn-back-main {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 3000;
            padding: 12px 20px;
            background: rgba(10, 10, 10, 0.8);
            border: 2px solid var(--accent);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: none; /* Escondido por padrão */
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        #btn-back-main:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sub);
        }
        body.submap-active #btn-back-main { display: flex; animation: fadeIn 0.5s; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* ================= SIDEBAR ================= */
        .sidebar {
            position: fixed; top: 20px; right: 0; width: 340px; height: calc(100vh - 40px);
            background: var(--bg-panel); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border); border-right: none; border-radius: 12px 0 0 12px;
            box-shadow: -10px 20px 50px rgba(0,0,0,0.8); z-index: 2000;
            display: flex; flex-direction: column; transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .sidebar.collapsed { transform: translateX(100%); }

        .sidebar-toggle {
            position: absolute; left: -40px; top: 20px; width: 40px; height: 40px;
            background: #151515; border: 1px solid var(--border); border-right: none; border-radius: 8px 0 0 8px;
            color: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 20px; box-shadow: -5px 5px 15px rgba(0,0,0,0.3); transition: 0.2s;
        }
        .sidebar-toggle:hover { color: #fff; background: var(--accent); border-color: var(--accent); padding-right: 5px; }

        .sidebar-header {
            padding: 20px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); border-radius: 12px 0 0 0; flex-shrink: 0;
        }
        .sidebar-header h2 { margin: 0; font-size: 16px; color: #fff; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; display:flex; align-items:center; gap:10px; }

        .sidebar-content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }

        /* Sidebar bloqueada quando no submapa */
        body.submap-active #sidebar {
            pointer-events: none;
            opacity: 0.5;
        }
        body.submap-active #sidebar .sidebar-toggle { pointer-events: auto; } /* Permite fechar a sidebar */

        .input-dark {
            width: 100%; background: #050505 !important; border: 1px solid #444; color: #fff !important;
            padding: 12px; border-radius: 6px; box-sizing: border-box; transition: 0.2s; font-size: 14px;
            color-scheme: dark;
        }
        .input-dark:focus { outline: none; border-color: var(--accent); background: #000 !important; }
        textarea.input-dark { resize: vertical; min-height: 80px; line-height: 1.5; }

        .search-box { position: relative; margin-bottom: 10px; }
        .search-box span { position: absolute; right: 12px; top: 12px; color: #666; pointer-events: none; }
        .search-options { display: flex; gap: 15px; font-size: 12px; color: #aaa; }
        .search-options label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .search-options input { accent-color: var(--accent); }

        .locais-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-height: 150px; }
        .location-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
        .location-item {
            padding: 10px; background: rgba(255,255,255,0.03); border: 1px solid transparent; border-radius: 6px;
            cursor: pointer; font-size: 14px; transition: 0.2s; display: flex; align-items: center; gap: 12px;
        }
        .location-item:hover { border-color: #555; background: rgba(255,255,255,0.08); transform: translateX(2px); }
        .loc-icon-small { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; background: #000; border: 1px solid #555; }

        .measure-tools { display: flex; flex-direction: column; gap: 10px; background: #111; padding: 10px; border-radius: 8px; border: 1px solid #333; }
        .measure-options { display: flex; gap: 10px; font-size: 11px; color: #ccc; justify-content: center; }
        .measure-options label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
        
        .btn-action {
            width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #ccc;
            border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 13px;
            display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase;
        }
        .btn-action:hover { background: #333; color: #fff; border-color: #666; }
        .btn-action.primary { background: var(--accent); color: white; border: none; }
        .btn-action.primary:hover { filter: brightness(1.2); box-shadow: 0 0 15px rgba(156, 39, 176, 0.4); }
        .btn-action.danger { background: #441111; color: #ff9999; border: 1px solid #662222; }
        .btn-action.danger:hover { background: var(--danger); color: white; }
        .btn-action.active { background: var(--accent); color: #fff; border-color: #d05ce3; }
        
        /* Botão específico para entrar no local no popup */
        .btn-enter-locale {
            background: #1a1a1a; border: 1px solid var(--accent); color: var(--accent);
            margin-top: 8px; justify-content: center; font-size: 11px; letter-spacing: 1px;
        }
        .btn-enter-locale:hover { background: var(--accent); color: #fff; box-shadow: var(--shadow-sub); }

        .planes-section { border-top: 1px solid var(--border); padding-top: 15px; margin-top: auto; flex-shrink: 0; max-height: 55vh; overflow-y: auto; display: flex; flex-direction: column; }
        .plane-category { margin-bottom: 8px; }
        .plane-cat-header { font-size: 10px; font-weight: bold; color: #666; text-transform: uppercase; letter-spacing: 1.5px; padding: 4px 2px; border-bottom: 1px solid #222; margin-bottom: 5px; }
        .plane-card { background: #111; border: 1px solid #333; border-radius: 6px; margin-bottom: 4px; overflow: hidden; transition: 0.2s; }
        .plane-header { padding: 9px 10px; cursor: pointer; font-weight: bold; font-size: 12px; color: #888; display: flex; justify-content: space-between; background: #1a1a1a; transition: 0.2s; }
        .plane-header:hover { color: #fff; background: #222; }
        .plane-body { padding: 12px; font-size: 12px; color: #999; line-height: 1.5; display: none; border-top: 1px solid #222; background: #0e0e0e; }
        .plane-card.open .plane-body { display: block; animation: fadeIn 0.3s; }
        .plane-card.open .plane-header { color: var(--accent); background: #222; border-bottom: 1px solid #333; }

        /* Menu de contexto unificado */
        #ctx-menu {
            position: absolute; background: #151515; border: 1px solid var(--accent);
            border-radius: 6px; padding: 5px 0; min-width: 180px; z-index: 9999; display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .ctx-item { padding: 10px 15px; color: #fff; font-size: 14px; cursor: pointer; transition: 0.2s; display:flex; gap:10px; align-items:center; }
        .ctx-item:hover { background: var(--accent); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 5000;
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .modal {
            background: #111; border: 1px solid #444; width: 650px; max-width: 90%;
            border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,1); display: flex; flex-direction: column;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-header { padding: 20px; background: #151515; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; border-radius: 12px 12px 0 0; }
        .modal-body { padding: 25px; overflow-y: auto; max-height: 70vh; display: flex; flex-direction: column; gap: 20px; }
        .modal-footer { padding: 20px; background: #151515; border-top: 1px solid #333; display: flex; justify-content: space-between; gap: 10px; border-radius: 0 0 12px 12px; }

        .upload-area {
            border: 2px dashed #444; background: #080808; border-radius: 8px; padding: 0;
            text-align: center; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100px;
        }
        .upload-area:hover { border-color: #777; background: #111; }
        .upload-area.has-file { border-style: solid; border-color: #555; }
        .upload-area.paste-active { border-color: var(--accent); box-shadow: 0 0 15px rgba(156, 39, 176, 0.3); background: #150515; }
        .upload-area.paste-active::after {
            content: 'SELECIONADO (CLIQUE P/ ABRIR OU CTRL+V)'; position: absolute; bottom: 5px; font-size: 9px; color: var(--accent); font-weight: bold; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px; width: calc(100% - 12px); box-sizing: border-box; text-align: center;
        }
        .upload-placeholder { padding: 20px; pointer-events: none; }
        .preview-img { width: 100%; height: 100%; object-fit: cover; display:block; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; margin-top: 10px; }
        .gallery-item { height: 90px; border-radius: 6px; border: 1px solid #444; overflow: hidden; position: relative; transition: transform 0.2s; }
        .gallery-item:hover { border-color: var(--accent); transform: scale(1.05); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        .gallery-remove { 
            position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.8); color: #f44336; 
            border: none; cursor: pointer; width: 20px; height: 20px; border-radius: 3px; 
            display: flex; align-items: center; justify-content: center; font-weight: bold;
        }

        /* Leaflet e Popup Customizado */
        .leaflet-popup-content-wrapper { background: #151515; border: 1px solid var(--accent); color: #ddd; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); padding: 0; overflow: visible; }
        .leaflet-popup-tip { background: var(--accent); }
        .leaflet-popup-content { margin: 15px; width: 320px !important; }
        
        /* Estilo para sub-points (menores e com sombra roxa) */
        .sub-map-icon {
            border: 2px solid var(--accent); border-radius: 50%;
            box-shadow: var(--shadow-sub);
            transition: transform 0.2s; background: #000; box-sizing: border-box; padding: 2px; object-fit: contain !important;
        }
        .sub-map-icon:hover { transform: scale(1.3); background: #1a1a1a; z-index: 1000 !important; }

        .popup-header { display:flex; align-items:center; gap: 10px; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 10px; }
        .popup-header-icon { width: 32px; height: 32px; border-radius: 50%; object-fit:cover; border:1px solid #555; background:#000; }
        .popup-title { font-weight: bold; color: var(--accent); font-size: 15px; flex:1; text-transform: uppercase; }
        .popup-actions { display: flex; gap: 5px; align-items: center; }
        .popup-edit-btn { background: none; border: none; color: #777; cursor: pointer; font-size: 16px; transition: 0.2s; padding: 0;}
        .popup-edit-btn:hover { color: #fff; transform: scale(1.1); }

        /* === SISTEMA DE EXPANDIR O LORE === */
        .popup-desc-wrapper {
            position: relative;
            width: 100%;
            height: 90px;
            margin-bottom: 10px;
        }

        .popup-desc-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column;
            border: 1px solid #333; border-radius: 6px; overflow: hidden; background: #0a0a0a;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 100;
        }

        .popup-desc-container.expanded {
            top: 15px; left: 20px; z-index: 9999;
            border-color: var(--accent);
            box-shadow: 0 10px 40px rgba(0,0,0,1), 0 0 20px rgba(156, 39, 176, 0.6);
        }

        .popup-desc-view {
            width: 100%; flex: 1; padding: 15px; margin: 0; border: none; background: transparent;
            color: #ccc; font-size: 14px; font-family: inherit; line-height: 1.6; outline: none;
            resize: none; overflow-y: auto; white-space: pre-wrap; cursor: text;
            box-sizing: border-box; min-height: 0; 
        }
        .popup-desc-view::-webkit-scrollbar { width: 4px; }
        .popup-desc-view::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }

        .popup-drag-handle {
            background: #1a1a1a; color: #666; text-align: center; font-size: 10px; font-weight: bold;
            padding: 8px 0; border-top: 1px solid #333; width: 100%; user-select: none;
            letter-spacing: 1px; flex-shrink: 0; cursor: pointer; transition: background 0.2s;
            box-sizing: border-box;
        }
        .popup-drag-handle:hover { background: #222; color: var(--accent); }
        
        .popup-img-main { 
            width: 100%; height: 160px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; cursor: pointer; border: 1px solid #333; display: block; transition: 0.2s;
        }
        .popup-img-main:hover { border-color: var(--accent); }
        
        .popup-gallery { display: flex; gap: 8px; overflow-x: auto; margin-top: 8px; padding-bottom: 5px; }
        .popup-thumb { width: 60px; height: 60px; border-radius: 6px; object-fit: cover; border: 1px solid #444; cursor: pointer; flex-shrink: 0; transition: 0.2s; }
        .popup-thumb:hover { border-color: var(--accent); transform: scale(1.1); }

        /* Ícone padrão do Mapa Mundi */
        .custom-map-icon { 
            border: 2px solid #fff; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.8); 
            transition: transform 0.2s; background: #111; box-sizing: border-box; padding: 4px; object-fit: contain !important; 
        }
        .custom-map-icon:hover { transform: scale(1.3); border-color: var(--accent); z-index: 1000 !important; }

        .lightbox { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index: 10000; display:none; justify-content:center; align-items:center; cursor: zoom-out; animation: fadeIn 0.2s; }
        .lightbox img { max-width: 95%; max-height: 95%; border: 2px solid #333; box-shadow: 0 0 50px black; border-radius: 4px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    </style>
</head>
<body>

    <button id="btn-back-main" onclick="voltarMapaMundi()">⬅ Voltar para o Mapa Mundi</button>

    <div id="maps-wrapper">
        <div id="map" class="map-instance"></div>
        
        <div id="sub-map-container" class="map-instance">
            <div id="sub-map"></div>
        </div>
    </div>

    <div class="sidebar collapsed" id="sidebar">
        <div class="sidebar-toggle" onclick="toggleSidebar()">⚙</div>
        
        <div class="sidebar-header">
            <h2>Atlas de Herdeiros</h2>
        </div>

        <div class="sidebar-content">
            
            <div class="map-switcher">
                <label style="font-size:11px; color:#666; font-weight:bold; margin-bottom:5px; display:block;">ESTILO DE MAPA</label>
                <select id="map-style-select" class="input-dark" onchange="mudarMapa(this.value)">
                    <option value="img/imagem-no-site/mapa-runeterra.png">Mapa de Regiões</option>
                    <option value="img/imagem-no-site/mapa-runeterra-politico.png">Mapa Político</option>
                </select>
            </div>
            
            <hr style="border:0; border-top:1px solid #333; width:100%; margin:0;">

            <div class="measure-tools">
                <label style="font-size:11px; color:#666; font-weight:bold; margin-bottom:5px; display:block;">FERRAMENTA DE MEDIÇÃO</label>
                
                <div class="measure-options">
                    <label><input type="radio" name="measure-mode" value="line" checked> Reta</label>
                    <label><input type="radio" name="measure-mode" value="draw"> Desenho</label>
                </div>

                <div style="display:flex; gap: 8px;">
                    <button class="btn-action" id="btn-medir" onclick="toggleMedicao()" style="flex:1;">📏 Ativar (Clique A -> B)</button>
                    <button class="btn-action" onclick="limparMedicao()" style="width: auto; background: #221111; border-color: #442222; color: #ff8888;" title="Limpar Medição">🗑️</button>
                </div>
                <div id="distancia-res" style="font-size: 13px; color: #e0aaff; margin-top: 5px; text-align: center; min-height: 18px; font-weight: bold; font-family: monospace;"></div>
            </div>

            <hr style="border:0; border-top:1px solid #333; width:100%; margin:0;">

            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="search-input" class="input-dark" placeholder="Pesquisar local..." onkeyup="filtrarLocais()">
                    <span style="position: absolute; right: 12px; top: 12px; color: #666;">🔍</span>
                </div>
                <div class="search-options">
                    <label><input type="radio" name="search-filter" value="nome" checked> Por Nome</label>
                    <label><input type="radio" name="search-filter" value="desc"> Por Lore</label>
                </div>
            </div>

            <div class="locais-container">
                <label style="font-size:11px; color:#666; font-weight:bold; margin-bottom:8px; display:block;">LOCAIS DESCOBERTOS</label>
                <ul id="lista-locais" class="location-list">
                </ul>
            </div>

            <div class="planes-section">
                <label style="font-size:11px; color:#666; font-weight:bold; margin-bottom:10px; display:block;">PLANOS DE EXISTÊNCIA</label>
                <div id="planes-container"></div>
            </div>
        </div>
    </div>

    <div id="ctx-menu">
        </div>

    <div class="modal-overlay" id="modal-form">
        <div class="modal">
            <div class="modal-header">
                <h3 style="margin:0; color:#fff;" id="modal-title">Novo Local</h3>
                <button onclick="fecharModal()" style="background:none; border:none; color:#fff; font-size:24px; cursor:pointer;">✖</button>
            </div>
            <div class="modal-body">
                <div>
                    <label class="field-label">NOME DO LOCAL</label>
                    <input type="text" id="input-nome" class="input-dark" placeholder="Ex: Fortaleza Noxkraya ou Taverna do Dragão">
                </div>

                <div id="group-submap-url">
                    <label class="field-label" style="color: var(--accent);">IMAGEM DO MAPA INTERNO (Opcional)</label>
                    <input type="text" id="input-submap-url" class="input-dark" placeholder="Ex: img/imagem-no-site/mapa-cidade.png">
                    <span style="font-size:10px; color:#666; margin-top:2px; display:block;">Coloque o caminho da imagem se este local tiver um mapa próprio explorável.</span>
                </div>

                <div style="display:flex; gap:20px;">
                    <div style="flex: 0 0 130px;">
                        <label class="field-label" style="color:#e0aaff;">ÍCONE (Clique p/ Focar)</label>
                        <div class="upload-area" id="area-icon" title="Clique para selecionar, e depois clique de novo para abrir">
                            <div class="upload-placeholder" id="placeholder-icon" style="display:flex; flex-direction:column; align-items:center;">
                                <span style="font-size:24px; margin-bottom:5px;">📍</span>
                                <span style="font-size:11px; color:#666;">Clique p/ Selecionar</span>
                            </div>
                            <img id="preview-icon" class="preview-img" style="display:none;">
                        </div>
                        <input type="file" id="file-icon" accept="image/*" style="display:none;">
                    </div>

                    <div style="flex:1;">
                        <label class="field-label">GALERIA DE IMAGENS (Clique p/ Focar)</label>
                        <div class="upload-area" id="area-gallery" style="height:70px; min-height:auto; border-style:dashed;">
                            <div class="upload-placeholder" style="padding:10px;">
                                <span style="font-size:12px; color:#888;">Clique aqui. Após ativo, use <strong>Ctrl+V</strong> ou Clique novamente</span>
                            </div>
                        </div>
                        <div class="gallery-grid" id="gallery-container"></div>
                        <input type="file" id="file-gallery" accept="image/*" style="display:none;" multiple>
                    </div>
                </div>

                <div>
                    <label class="field-label">DESCRIÇÃO / LORE</label>
                    <textarea id="input-desc" class="input-dark" style="height:120px;" placeholder="História, perigos, NPCs importantes... (Aperte Enter para pular linha!)"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="deletarPin()" id="btn-delete" class="btn-action danger" style="width:auto; padding:10px 20px; display:none;">🗑️ Apagar Point</button>
                <div style="flex:1;"></div>
                <button onclick="salvarPin()" class="btn-action primary" style="width:auto; padding: 10px 30px;">Salvar Local</button>
            </div>
        </div>
    </div>

    <div class="lightbox" id="lightbox" onclick="this.style.display='none'">
        <img id="lightbox-img">
    </div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // ================= CONFIGURAÇÕES E ESTADO =================
        const API_URL = 'https://dandd-chan.onrender.com/api';
        const IMG_DEFAULT_ICON = 'https://cdn-icons-png.flaticon.com/512/684/684908.png';
        const MAP_BOUNDS = [[0,0], [1080,1920]]; // Limites padrão (Mundi e Sub)

        // Instâncias dos Mapas
        let mapMundi, subMap;
        let mundiOverlay, subMapOverlay;
        
        // Estado Global
        let markersMundi = []; // Pins do mapa principal [{id, marker, data...}]
        let currentSubMarkers = []; // Pins do submapa atualmente aberto
        let activeMainPinId = null; // ID do pin principal que estamos "dentro"
        
        // Variáveis temporárias de controle
        let tempCoords = null;
        let editId = null;
        let isEditingSubPin = false; // Define se estamos editando um ponto principal ou sub-ponto
        let galleryImages = []; 
        let iconImage = null;
        let pasteTarget = 'gallery'; 

        // Ferramenta de medição
        let isMeasuringSession = false; 
        let isDrawing = false; 
        let measureLine = null; 
        let measurePoints = []; 

        // Adicionar classe CSS utilitária que faltava
        const styleSheet = document.styleSheets[0];
        styleSheet.insertRule('.field-label { display:block; color:#aaa; font-size:12px; margin-bottom:5px; font-weight:bold; }', styleSheet.cssRules.length);

        // Dados Fixos (Planos)
        const PLANE_CATEGORIES = [
            { id: 'central',   name: '🌍 Planos Centrais' },
            { id: 'superior',  name: '🌌 Planos Superiores' },
            { id: 'elemental', name: '🔥 Planos Elementais' },
            { id: 'externo',   name: '✨ Planos Externos' },
            { id: 'infernal',  name: '👹 Planos Infernais' }
        ];

       const PLANES_DATA = [
            { id: 'material', cat: 'central', name: 'Plano Material', desc: 'O universo tangível onde vivem os mortais. Onde o Éter e o Vazio colidem diretamente.' },
            { id: 'etereo', cat: 'central', name: 'Plano Etéreo', desc: 'Névoa sobreposta ao Material. Usado para viagens curtas ou habitado por fantasmas.' },
            { id: 'astral', cat: 'central', name: 'Plano Astral', desc: 'Mar de pensamentos e sonhos. Conecta o Material aos Planos Externos.' },
            { id: 'vazio_plano', cat: 'central', name: 'O Vazio', desc: 'Realidade de energia negativa. Contrapeso necessário ao Éter, corrompe tudo que toca.' },
            { id: 'elyseos', cat: 'superior', name: 'Campos Elíseos', desc: 'A camada mais alta da existência. Onde os deuses residem fisicamente.' },
            { id: 'asterios', cat: 'superior', name: 'Astérios', desc: 'Santuários criados pelos deuses para acolher as almas limpas de seus seguidores.' },
            { id: 'caos_elemental', cat: 'elemental', name: 'Caos Elemental', desc: 'Convergência violenta onde todos os elementos se chocam infinitamente.' },
            { id: 'elem_ar', cat: 'elemental', name: 'Plano do Ar', desc: 'Céus infinitos e tempestades sencientes na pureza do elemento ar.' },
            { id: 'elem_fogo', cat: 'elemental', name: 'Plano do Fogo', desc: 'Inferno brilhante de lava e calor implacável sem necessidade de combustível.' },
            { id: 'elem_terra', cat: 'elemental', name: 'Plano da Terra', desc: 'Dimensão maciça de rocha sólida, cavernas e veios de minérios Étreos.' },
            { id: 'elem_agua', cat: 'elemental', name: 'Plano da Água', desc: 'Oceano global sem fundo protegido de contaminações externas.' },
            { id: 'arborea', cat: 'externo', name: 'Arbórea', desc: 'Plano das paixões desenfreadas e da natureza em seu estado selvagem e gigante.' },
            { id: 'arcadia', cat: 'externo', name: 'Arcádia', desc: 'Ordem perfeita aplicada à natureza. Tudo cresce em simetria matemática.' },
            { id: 'bandopolis', cat: 'externo', name: 'Bandópolis', desc: 'Reino mágico atemporal habitado por yordles e seres de feitiçaria antiga.' },
            { id: 'bhasm', cat: 'externo', name: 'Bhasm', desc: 'Reflexo arruinado do mundo terreno. Um mundo silencioso de cinzas.' },
            { id: 'mechanus', cat: 'externo', name: 'Mechanus', desc: 'Lógica pura e engrenagens infitinas governadas pela lei absoluta.' },
            { id: 'acheron', cat: 'externo', name: 'Acheron', desc: 'Cubos metálicos flutuantes no vazio servindo de cenário para guerra eterna.' },
            { id: 'hades', cat: 'infernal', name: 'Hades', desc: 'Desesperança total. Lugar cinzento que drena a cor e a vontade de viver das almas.' },
            { id: 'nove_infernos', cat: 'infernal', name: 'Os Nove Infernos', desc: 'Império burocrático de punição governado por Anilla e os Reis Demônios.' },
            { id: 'gehenna', cat: 'infernal', name: 'Gehenna', desc: 'Vulcões flutuantes sem topo ou base. Lar dos mercenários Yugoloths.' },
            { id: 'carceri', cat: 'infernal', name: 'Carceri', desc: 'O plano prisão definitivo do multiverso. Nada que entra consegue sair.' },
            { id: 'pandemonio', cat: 'infernal', name: 'Pandemônio', desc: 'Labirinto claustrofóbico de túneis com ventos gélidos que causam loucura.' }
        ];

        // ================= INICIALIZAÇÃO =================
        window.onload = function() {
            initMapMundi();
            initSubMap();
            
            renderPlanes();
            carregarDadosServidor();

            // Sincronização automática apenas se estivermos no Mapa Mundi e modal fechado
            setInterval(() => {
                if(!activeMainPinId && document.getElementById('modal-form').style.display !== 'flex') {
                    sincronizarMapa();
                }
            }, 10000); 
        };

        // Configuração do Mapa Principal
        function initMapMundi() {
            mapMundi = L.map('map', {
                crs: L.CRS.Simple, minZoom: -3, maxZoom: 2, zoomControl: false, attributionControl: false, maxBoundsViscosity: 0.8 
            });
            mapMundi.setMaxBounds(MAP_BOUNDS); 
            const initialMapUrl = document.getElementById('map-style-select').value;
            mundiOverlay = L.imageOverlay(initialMapUrl, MAP_BOUNDS).addTo(mapMundi);
            mapMundi.fitBounds(MAP_BOUNDS);
            L.control.zoom({ position: 'bottomright' }).addTo(mapMundi);

            // Eventos do Mapa Mundi
            mapMundi.on('contextmenu', e => abrirContextMenu(e, false));
            mapMundi.on('click', e => handleMapClick(e, mapMundi));
            mapMundi.on('mousemove', e => handleMapMouseMove(e, mapMundi));
            mapMundi.on('popupclose', () => mapMundi.setMaxBounds(MAP_BOUNDS));
            mapMundi.on('movestart', fecharContextMenu);
        }

        // Configuração do Mapa Secundário (SubMapa)
        function initSubMap() {
            subMap = L.map('sub-map', {
                crs: L.CRS.Simple, minZoom: -2, maxZoom: 3, zoomControl: false, attributionControl: false 
            });
            // O overlay é criado dinamicamente ao entrar no local
            L.control.zoom({ position: 'bottomright' }).addTo(subMap);

            // Eventos do SubMapa
            subMap.on('contextmenu', e => abrirContextMenu(e, true));
            subMap.on('click', fecharContextMenu);
            subMap.on('movestart', fecharContextMenu);
        }

        // ================= SISTEMA DE DRILL-DOWN (ENTRAR/SAIR) =================
        
        window.entrarNoLocal = function(pinId) {
            const pinMundi = markersMundi.find(m => m.id === pinId);
            if(!pinMundi || !pinMundi.subMapUrl) {
                alert("Este local não possui um mapa interno configurado.");
                return;
            }

            // Define o local ativo e fecha popups
            activeMainPinId = pinId;
            pinMundi.marker.closePopup();

            // Configura a imagem do submapa
            if(subMapOverlay) subMap.removeLayer(subMapOverlay);
            subMapOverlay = L.imageOverlay(pinMundi.subMapUrl, MAP_BOUNDS).addTo(subMap);
            
            // Ativa visualmente o submapa
            document.body.classList.add('submap-active');
            
            // Reseta view do submapa
            subMap.setView([540, 960], -1); // Centro padrão ajustado para fit
            subMap.fitBounds(MAP_BOUNDS);

            // Carrega os sub-points deste local
            renderSubPins(pinMundi.subPins || []);
            
            toggleSidebar(true); // Força fechar sidebar se aberta
        }

        window.voltarMapaMundi = function() {
            document.body.classList.remove('submap-active');
            activeMainPinId = null;
            limparSubMarkers();
            // Dá um pequeno tempo para a transição CSS e reajusta o mapa principal
            setTimeout(() => mapMundi.invalidateSize(), 500);
        }

        // ================= GERENCIAMENTO DE PINS (MUNDI E SUB) =================

        // Gera o HTML do ícone (unificado para mundi e sub)
        function gerarIconHtml(iconSrc, isSubPin) {
            const className = isSubPin ? 'sub-map-icon' : 'custom-map-icon';
            const size = isSubPin ? '24px' : '40px';
            return `<img src="${iconSrc}" class="${className}" style="width:${size}; height:${size};">`;
        }

        // --- Mapa Mundi ---
        function criarMarcadorMundi(data) {
            const safeIcon = data.icon || IMG_DEFAULT_ICON;
            const iconHtml = gerarIconHtml(safeIcon, false);
            const customIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [40, 40], iconAnchor: [20, 20], popupAnchor: [0, -20] });
            
            const marker = L.marker([data.lat, data.lng], {icon: customIcon}).addTo(mapMundi);
            
            // Destrava bounds ao clicar para permitir auto-pan
            marker.on('click', () => mapMundi.setMaxBounds(null));

            const pinData = { ...data, marker, subPins: data.subPins || [] };
            marker.bindPopup(() => gerarPopupContent(pinData, false), { maxWidth: 2000 });
            markersMundi.push(pinData);
        }

        // --- Sub Mapa ---
        function renderSubPins(subPinsData) {
            limparSubMarkers();
            subPinsData.forEach(data => {
                const safeIcon = data.icon || IMG_DEFAULT_ICON;
                const iconHtml = gerarIconHtml(safeIcon, true);
                const customIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [24, 24], iconAnchor: [12, 12], popupAnchor: [0, -12] });
                
                const marker = L.marker([data.lat, data.lng], {icon: customIcon}).addTo(subMap);
                
                const subPinObj = { ...data, marker };
                marker.bindPopup(() => gerarPopupContent(subPinObj, true), { maxWidth: 2000 });
                currentSubMarkers.push(subPinObj);
            });
        }

        function limparSubMarkers() {
            currentSubMarkers.forEach(m => subMap.removeLayer(m.marker));
            currentSubMarkers = [];
        }

        // Atualiza visual de um pin existente (unificado)
        function refreshMarkerVisuals(pin, isSub) {
            const iconHtml = gerarIconHtml(pin.icon, isSub);
            const size = isSub ? [24, 24] : [40, 40];
            const anchor = isSub ? [12, 12] : [20, 20];
            const pAnchor = isSub ? [0, -12] : [0, -20];

            const newIcon = L.divIcon({ html: iconHtml, className: '', iconSize: size, iconAnchor: anchor, popupAnchor: pAnchor });
            pin.marker.setIcon(newIcon);
            pin.marker.setPopupContent(gerarPopupContent(pin, isSub));
        }

        // ================= POPUP CONTENT E INTERAÇÕES =================

        function gerarPopupContent(pin, isSub) {
            let html = `
                <div class="popup-header">
                    <img src="${pin.icon}" class="popup-header-icon">
                    <span class="popup-title">${pin.nome}</span>
                    <div class="popup-actions">
                        <button class="popup-edit-btn" onclick="abrirModal(${pin.id}, ${isSub})" title="Editar">✏️</button>
                    </div>
                </div>
            `;

            // Lógica de imagens (galeria + ícone)
            let todasImagens = [];
            if(pin.gallery && pin.gallery.length > 0) todasImagens.push(...pin.gallery);
            if(pin.icon !== IMG_DEFAULT_ICON && !todasImagens.includes(pin.icon)) todasImagens.unshift(pin.icon);
            if(todasImagens.length === 0) todasImagens.push(IMG_DEFAULT_ICON);

            html += `<img src="${todasImagens[0]}" id="main-img-${pin.id}" class="popup-img-main" onclick="verFull(this.src)">`;

            if(todasImagens.length > 1) {
                html += `<div class="popup-gallery">`;
                todasImagens.forEach((img) => {
                    html += `<img src="${img}" class="popup-thumb" onclick="trocarImagemPrincipal(this, ${pin.id})">`;
                });
                html += `</div>`;
            }

            // Lore expandível
            let descHtml = pin.desc || "Sem descrição disponível.";
            html += `
                <div class="popup-desc-wrapper">
                    <div class="popup-desc-container" id="desc-box-${pin.id}">
                        <textarea readonly class="popup-desc-view">${descHtml}</textarea>
                        <div class="popup-drag-handle" onclick="toggleExpandirLore(this, ${pin.id})">⤡ Clique para expandir lore ⤡</div>
                    </div>
                </div>
            `;

            // BOTÃO MÁGICO: Apenas para pontos principais que possuem mapa interno
            if(!isSub && pin.subMapUrl) {
                html += `
                    <button class="btn-action btn-enter-locale" onclick="entrarNoLocal(${pin.id})">
                        🗺️ EXPLORAR MAPA INTERNO
                    </button>
                `;
            }

            return html;
        }

        // Funções auxiliares do popup (globais para onclick)
        window.trocarImagemPrincipal = (element, pinId) => {
            const mainImg = document.getElementById(`main-img-${pinId}`);
            if(mainImg) mainImg.src = element.src; 
        };

        window.verFull = (src) => {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        };

        window.toggleExpandirLore = (btn, pinId) => {
            const box = document.getElementById(`desc-box-${pinId}`);
            const textarea = box.querySelector('.popup-desc-view');
            const isSub = currentSubMarkers.some(m => m.id === pinId);
            const activeMap = isSub ? subMap : mapMundi;

            if (box.classList.contains('expanded')) {
                box.classList.remove('expanded');
                btn.textContent = '⤡ Clique para expandir lore ⤡';
                box.style.width = ''; box.style.height = '';
            } else {
                box.classList.add('expanded');
                btn.textContent = '✖ Clique para fechar';
                box.style.width = '420px';
                
                // Auto-height baseado no texto
                textarea.style.height = '1px'; 
                let alturaTexto = textarea.scrollHeight;
                textarea.style.height = 'auto'; 

                let alturaAlvo = Math.max(150, Math.min(alturaTexto + 40, window.innerHeight * 0.55));
                box.style.height = alturaAlvo + 'px';

                // Pan da câmera para centralizar o lore expandido
                setTimeout(() => {
                    const rect = box.getBoundingClientRect();
                    let panX = 0, panY = 0;
                    if (rect.bottom > window.innerHeight) panY = (rect.bottom - window.innerHeight) + 30; 
                    if (rect.top < 60) panY = rect.top - 60; 
                    if (rect.right > window.innerWidth) panX = (rect.right - window.innerWidth) + 30;
                    if (rect.left < 30) panX = rect.left - 30;

                    if (panX !== 0 || panY !== 0) {
                        activeMap.panBy([panX, panY], { animate: true, duration: 0.4 });
                    }
                }, 300);
            }
        };

        // ================= FORMULÁRIO MODAL (CRIAÇÃO/EDIÇÃO) =================

        function abrirModal(pinId, isSub) {
            fecharContextMenu();
            document.getElementById('modal-form').style.display = 'flex';
            isEditingSubPin = isSub; // Guarda contexto
            
            const fieldSubMapUrl = document.getElementById('group-submap-url');

            if (pinId) {
                editId = pinId;
                const pin = isSub ? currentSubMarkers.find(m => m.id === pinId) : markersMundi.find(m => m.id === pinId);
                
                document.getElementById('modal-title').innerText = isSub ? "Editar Ponto de Interesse" : "Editar Local Principal";
                document.getElementById('btn-delete').style.display = 'block';
                document.getElementById('input-nome').value = pin.nome;
                document.getElementById('input-desc').value = pin.desc;
                
                // Campo mapa interno só aparece para pontos principais
                if(!isSub) {
                    fieldSubMapUrl.style.display = 'block';
                    document.getElementById('input-submap-url').value = pin.subMapUrl || "";
                } else {
                    fieldSubMapUrl.style.display = 'none';
                }

                galleryImages = [...(pin.gallery || [])];
                iconImage = pin.icon;
            } else {
                editId = null;
                document.getElementById('modal-title').innerText = isSub ? "Novo Ponto de Interesse" : "Novo Local Principal";
                document.getElementById('btn-delete').style.display = 'none';
                document.getElementById('input-nome').value = "";
                document.getElementById('input-desc').value = "";
                
                if(!isSub) {
                    fieldSubMapUrl.style.display = 'block';
                    document.getElementById('input-submap-url').value = "";
                } else {
                    fieldSubMapUrl.style.display = 'none';
                }

                galleryImages = [];
                iconImage = null;
                setTimeout(() => document.getElementById('input-nome').focus(), 100);
            }
            renderFormVisuals();
            setPasteTarget('gallery');
        }

        function fecharModal() { document.getElementById('modal-form').style.display = 'none'; tempCoords = null;}

        async function salvarPin() {
            const nome = document.getElementById('input-nome').value;
            const desc = document.getElementById('input-desc').value;
            const subMapUrl = isEditingSubPin ? null : document.getElementById('input-submap-url').value;

            if(!nome) { alert("O nome é obrigatório!"); return; }
            const finalIcon = iconImage || IMG_DEFAULT_ICON;

            // Objeto de dados base
            let pinCoreData = {
                nome, desc, icon: finalIcon, gallery: [...galleryImages]
            };

            if (editId) {
                // MODO EDIÇÃO
                if(isEditingSubPin) {
                    // Atualiza no array temporário do submapa
                    const subPin = currentSubMarkers.find(m => m.id === editId);
                    Object.assign(subPin, pinCoreData);
                    refreshMarkerVisuals(subPin, true);
                    
                    // IMPORTANTE: Achar o pin principal correspondente e atualizar o array subPins dele
                    const mainPin = markersMundi.find(m => m.id === activeMainPinId);
                    const index = mainPin.subPins.findIndex(sp => sp.id === editId);
                    // Atualiza os dados no array que vai pro servidor, mantendo as coordenadas antigas
                    Object.assign(mainPin.subPins[index], pinCoreData); 

                } else {
                    // Atualiza Pin Principal
                    const pin = markersMundi.find(m => m.id === editId);
                    Object.assign(pin, pinCoreData);
                    pin.subMapUrl = subMapUrl; // Adiciona campo específico
                    refreshMarkerVisuals(pin, false);
                }
            } else {
                // MODO CRIAÇÃO
                if(!tempCoords) { alert("Erro de posicionamento."); return; }
                const novoId = Date.now();
                const novaData = { ...pinCoreData, id: novoId, lat: tempCoords.lat, lng: tempCoords.lng };

                if(isEditingSubPin) {
                    novaData.isSub = true; // Flag útil
                    // Adiciona visualmente ao submapa
                    renderSubPins([...currentSubMarkers, novaData]);
                    
                    // Adiciona ao array do pin principal para salvar
                    const mainPin = markersMundi.find(m => m.id === activeMainPinId);
                    if(!mainPin.subPins) mainPin.subPins = [];
                    mainPin.subPins.push(novaData);
                } else {
                    // Cria Pin Principal
                    novaData.subMapUrl = subMapUrl;
                    novaData.subPins = [];
                    criarMarcadorMundi(novaData);
                }
            }

            // Salva as alterações no servidor (sempre envia o estado do Mapa Mundi)
            await salvarEstadoNoServidor();
            fecharModal();
            atualizarListaLateral();
        }

        async function deletarPin() {
            if(!editId) return;
            if(!confirm("Tem certeza que deseja apagar este ponto? Esta ação não pode ser desfeita.")) return;

            if(isEditingSubPin) {
                // Deleta SubPin
                limparSubMarkers(); // Remove todos visualmente temporariamente
                
                // Acha o principal e remove do array de dados
                const mainPin = markersMundi.find(m => m.id === activeMainPinId);
                mainPin.subPins = mainPin.subPins.filter(sp => sp.id !== editId);
                
                // Re-renderiza o submapa com a lista atualizada
                renderSubPins(mainPin.subPins);
            } else {
                // Deleta Pin Principal
                const index = markersMundi.findIndex(m => m.id === editId);
                if(index > -1) {
                    mapMundi.removeLayer(markersMundi[index].marker);
                    markersMundi.splice(index, 1);
                }
            }

            await salvarEstadoNoServidor();
            fecharModal();
            atualizarListaLateral();
        }

        // ================= MENU DE CONTEXTO E CLIQUES NO MAPA =================

        function abrirContextMenu(e, isSub) {
            L.DomEvent.preventDefault(e);
            if(isMeasuringSession) return;
            
            tempCoords = e.latlng;
            const menu = document.getElementById('ctx-menu');
            
            // Define conteúdo baseado se é Mapa Mundi ou SubMapa
            if(isSub) {
                menu.innerHTML = `<div class="ctx-item" onclick="abrirModal(null, true)">📍 Criar Ponto de Interesse Aqui</div>`;
            } else {
                menu.innerHTML = `<div class="ctx-item" onclick="abrirModal(null, false)">🏰 Criar Local Principal Aqui</div>`;
            }

            menu.style.display = 'block';
            menu.style.left = e.containerPoint.x + 'px';
            menu.style.top = e.containerPoint.y + 'px';
        }

        function fecharContextMenu() { document.getElementById('ctx-menu').style.display = 'none'; }

        function handleMapClick(e, activeMap) {
            fecharContextMenu();
            if (isMeasuringSession) {
                if (!isDrawing) {
                    isDrawing = true;
                    measurePoints = [e.latlng]; 
                    if (measureLine) activeMap.removeLayer(measureLine);
                    measureLine = L.polyline(measurePoints, {color: '#9c27b0', dashArray: '10, 10'}).addTo(activeMap);
                    document.getElementById('distancia-res').innerText = "Clique no destino para finalizar...";
                } else {
                    isDrawing = false;
                    document.getElementById('distancia-res').innerText += " (Finalizado)";
                    desativarMedicao();
                }
            }
        }

        function handleMapMouseMove(e, activeMap) {
            if(isMeasuringSession && isDrawing) {
                const mode = document.querySelector('input[name="measure-mode"]:checked').value;
                if (mode === 'line') {
                    measureLine.setLatLngs([measurePoints[0], e.latlng]);
                    const distPixels = activeMap.project(measurePoints[0]).distanceTo(activeMap.project(e.latlng));
                    const distMetros = (distPixels * 0.015).toFixed(1);
                    document.getElementById('distancia-res').innerText = `${distMetros}m`;
                } else {
                    // Modo desenho livre (vários pontos)
                    measurePoints.push(e.latlng);
                    measureLine.setLatLngs(measurePoints);
                    let totalPixels = 0;
                    for(let i = 0; i < measurePoints.length - 1; i++) {
                        totalPixels += activeMap.project(measurePoints[i]).distanceTo(activeMap.project(measurePoints[i+1]));
                    }
                    const distMetros = (totalPixels * 0.015).toFixed(1);
                    document.getElementById('distancia-res').innerText = `${distMetros}m`;
                }
            }
        }

        // ================= PERSISTÊNCIA DE DADOS (SERVIDOR) =================

        // Envia todo o estado atual do markersMundi (que contém os subPins embutidos)
        async function salvarEstadoNoServidor() {
            // Prepara dados limpando as referências circulares do Leaflet (marker)
            const dadosParaSalvar = markersMundi.map(m => {
                const { marker, ...resto } = m;
                // Garante que subPins também não tenham referências circulares
                if(resto.subPins) {
                    resto.subPins = resto.subPins.map(sp => {
                        const { marker: subMarker, ...subResto } = sp;
                        return subResto;
                    });
                }
                return resto;
            });

            try {
                // O servidor usa uma rota genérica POST para salvar todo o array
                const res = await fetch(`${API_URL}/mapa-pins`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosParaSalvar) // Envia o array completo
                });
                if(!res.ok) throw new Error("Falha ao salvar no servidor.");
                console.log("Dados sincronizados com sucesso.");
            } catch(e) { 
                console.error("Erro na sincronização:", e);
                alert("Aviso: Falha ao salvar dados no servidor. Verifique sua conexão. As alterações podem ser perdidas ao recarregar.");
            }
        }

        // Carrega dados iniciais
        async function carregarDadosServidor() {
            try {
                const res = await fetch(`${API_URL}/mapa-pins`);
                if (!res.ok) return;
                const pinsSalvos = await res.json();
                
                // O servidor deve retornar o array completo
                if(Array.isArray(pinsSalvos)) {
                    pinsSalvos.forEach(p => criarMarcadorMundi(p));
                    atualizarListaLateral();
                }
            } catch(err) { console.error("Erro ao carregar dados:", err); }
        }

        // Sincronização automática em background (apenas para deletar/adicionar Pins Principais feitos por outros usuários)
        async function sincronizarMapa() {
            try {
                const res = await fetch(`${API_URL}/mapa-pins`);
                if (!res.ok) return;
                const serverPins = await res.json();
                if(!Array.isArray(serverPins)) return;

                const serverPinIds = serverPins.map(p => p.id);

                // 1. Remove Pins locais que não existem mais no servidor
                markersMundi = markersMundi.filter(localPin => {
                    if (!serverPinIds.includes(localPin.id)) {
                        mapMundi.removeLayer(localPin.marker);
                        return false;
                    }
                    return true;
                });

                // 2. Adiciona Pins novos ou atualiza Lore/Imagens
                serverPins.forEach(sp => {
                    const localPin = markersMundi.find(m => m.id === sp.id);
                    if (!localPin) {
                        criarMarcadorMundi(sp);
                    } else {
                        // Verifica se houve mudança estrutural ( lore, ícone, galeria, submapa, ou quantidade de subpins)
                        const mudou = localPin.nome !== sp.nome || 
                                      localPin.desc !== sp.desc || 
                                      localPin.icon !== sp.icon || 
                                      localPin.subMapUrl !== sp.subMapUrl ||
                                      (localPin.subPins?.length || 0) !== (sp.subPins?.length || 0) ||
                                      JSON.stringify(localPin.gallery) !== JSON.stringify(sp.gallery);
                        
                        if (mudou) {
                            // Atualiza dados e visual
                            Object.assign(localPin, sp);
                            localPin.subPins = sp.subPins || []; // Garante atualização dos dados embutidos
                            refreshMarkerVisuals(localPin, false);
                        }
                    }
                });
                atualizarListaLateral();
            } catch(e) { console.error("Erro no sync automático:", e); }
        }

        // ================= SIDEBAR, PLANOS E FERRAMENTAS GERAIS =================

        function toggleSidebar(forceClose = false) { 
            const sb = document.getElementById('sidebar');
            if(forceClose) sb.classList.add('collapsed');
            else sb.classList.toggle('collapsed'); 
        }

        // Renderiza a seção fixa dos Planos de Existência
        function renderPlanes() {
            const container = document.getElementById('planes-container');
            container.innerHTML = "";

            PLANE_CATEGORIES.forEach(cat => {
                const catDiv = document.createElement('div');
                catDiv.className = 'plane-category';
                catDiv.innerHTML = `<div class="plane-cat-header">${cat.name}</div>`;

                const planesInCat = PLANES_DATA.filter(p => p.cat === cat.id);
                planesInCat.forEach(plane => {
                    const card = document.createElement('div');
                    card.className = 'plane-card';
                    card.innerHTML = `
                        <div class="plane-header" onclick="this.parentElement.classList.toggle('open')">
                            <span>${plane.name}</span>
                            <span>▾</span>
                        </div>
                        <div class="plane-body">${plane.desc.replace(/\n/g, '<br>')}</div>
                    `;
                    catDiv.appendChild(card);
                });
                container.appendChild(catDiv);
            });
        }

        // Muda a imagem de fundo do Mapa Mundi
        window.mudarMapa = function(url) {
            if(mundiOverlay) mundiOverlay.setUrl(url);
        };

        // Filtro e Lista Lateral (Apenas pontos principais)
        function atualizarListaLateral() {
            const lista = document.getElementById('lista-locais');
            lista.innerHTML = "";
            const termo = document.getElementById('search-input').value.toLowerCase();
            const filterType = document.querySelector('input[name="search-filter"]:checked').value;

            markersMundi.forEach(pin => {
                let match = false;
                if(filterType === 'nome') match = pin.nome.toLowerCase().includes(termo);
                else match = (pin.desc || "").toLowerCase().includes(termo);
                
                if(termo !== "" && !match) return;
                
                const li = document.createElement('li');
                li.className = 'location-item';
                const iconSrc = pin.icon || IMG_DEFAULT_ICON;
                li.innerHTML = `<img src="${iconSrc}" class="loc-icon-small"> <span>${pin.nome}</span>`;
                
                li.onclick = () => { 
                    if(activeMainPinId) voltarMapaMundi(); // Sai do submapa se estiver dentro
                    mapMundi.setMaxBounds(null); // Destrava bounds
                    mapMundi.flyTo([pin.lat, pin.lng], 1, { animate: true, duration: 1 }); 
                    setTimeout(() => pin.marker.openPopup(), 1200);
                };
                lista.appendChild(li);
            });
        }
        function filtrarLocais() { atualizarListaLateral(); }

        // --- Lógica das Imagens (Upload, Paste, Compress) ---
        function setPasteTarget(target) {
            pasteTarget = target;
            document.getElementById('area-icon').classList.remove('paste-active');
            document.getElementById('area-gallery').classList.remove('paste-active');
            document.getElementById(`area-${target}`).classList.add('paste-active');
        }

        function comprimirImagem(file, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 800; // Max largura ou altura
                    let width = img.width; height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                    } else {
                        if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/webp', 0.7)); // Salva como WebP comprimido
                }
            }
        }

        // Eventos de Upload/Colagem
        document.getElementById('area-icon').addEventListener('click', () => {
            if (pasteTarget !== 'icon') setPasteTarget('icon'); 
            else document.getElementById('file-icon').click();
        });
        document.getElementById('file-icon').addEventListener('change', e => {
            const file = e.target.files[0];
            if(file) comprimirImagem(file, res => { iconImage = res; renderFormVisuals(); });
        });

        document.getElementById('area-gallery').addEventListener('click', () => {
            if (pasteTarget !== 'gallery') setPasteTarget('gallery'); 
            else document.getElementById('file-gallery').click();
        });
        document.getElementById('file-gallery').addEventListener('change', e => {
            Array.from(e.target.files).forEach(file => { 
                comprimirImagem(file, res => { galleryImages.push(res); renderFormVisuals(); }); 
            });
        });

        // Captura Ctrl+V global no modal
        document.addEventListener('paste', e => {
            if(document.getElementById('modal-form').style.display !== 'flex') return;
            // Impede colagem padrão se estiver focado em input de texto
            if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.kind === 'file' && item.type.includes('image/')) {
                    comprimirImagem(item.getAsFile(), res => {
                        if(pasteTarget === 'icon') iconImage = res;
                        else galleryImages.push(res);
                        renderFormVisuals();
                    });
                }
            }
        });

        // Atualiza visualização no formulário
        function renderFormVisuals() {
            const container = document.getElementById('gallery-container');
            container.innerHTML = "";
            galleryImages.forEach((img, idx) => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `<img src="${img}"><button class="gallery-remove" onclick="removeImg(event, ${idx})">×</button>`;
                container.appendChild(div);
            });

            const prevIcon = document.getElementById('preview-icon');
            const placeIcon = document.getElementById('placeholder-icon');
            const areaIcon = document.getElementById('area-icon');

            if(iconImage && iconImage !== IMG_DEFAULT_ICON) {
                prevIcon.src = iconImage;
                prevIcon.style.display = 'block';
                placeIcon.style.display = 'none';
                areaIcon.classList.add('has-file');
            } else {
                prevIcon.style.display = 'none';
                placeIcon.style.display = 'flex';
                areaIcon.classList.remove('has-file');
            }
        }

        window.removeImg = (e, idx) => {
            e.stopPropagation();
            galleryImages.splice(idx, 1);
            renderFormVisuals();
        };

        // --- Funções da Ferramenta de Medição ---
        function toggleMedicao() {
            isMeasuringSession = !isMeasuringSession;
            const btn = document.getElementById('btn-medir');
            const activeMap = activeMainPinId ? subMap : mapMundi;
            const mapDom = activeMainPinId ? document.getElementById('sub-map') : document.getElementById('map');

            if(isMeasuringSession) {
                btn.classList.add('active');
                mapDom.style.cursor = 'crosshair';
                document.getElementById('distancia-res').innerText = "Clique no ponto A para começar...";
                isDrawing = false;
                
                // Adiciona listeners temporários no mapa ativo
                activeMap.on('mousemove', e => handleMapMouseMove(e, activeMap));
                activeMap.on('click', e => handleMapClick(e, activeMap));
            } else {
                desativarMedicao();
            }
        }

        function desativarMedicao() {
            isMeasuringSession = false;
            isDrawing = false;
            document.getElementById('btn-medir').classList.remove('active');
            document.getElementById('map').style.cursor = 'default';
            document.getElementById('sub-map').style.cursor = 'default';
            
            // Remove listeners
            mapMundi.off('mousemove'); mapMundi.off('click', handleMapClick);
            subMap.off('mousemove'); subMap.off('click', handleMapClick);
            
            // readiciona o click padrão para fechar context menu
            mapMundi.on('click', e => handleMapClick(e, mapMundi));
            subMap.on('click', fecharContextMenu);
        }

        function limparMedicao() {
            const activeMap = activeMainPinId ? subMap : mapMundi;
            if(measureLine) activeMap.removeLayer(measureLine);
            measureLine = null;
            measurePoints = [];
            isDrawing = false;
            document.getElementById('distancia-res').innerText = isMeasuringSession ? "Clique no ponto A..." : "";
        }

    </script>
